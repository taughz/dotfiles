# ~/.config/systemd/user/gpg-agent-extra.socket.d/gnupg-extra.conf

# Move the restricted "extra" socket into a dedicated directory, so that the
# directory can be bind mounted (e.g., into a container) without exposing the
# main agent socket. Mounting the directory, rather than the socket itself,
# survives the socket being recreated. The socket is named S.gpg-agent so that
# clients find it as their default agent socket. The agent identifies the socket
# by its file descriptor name, so the path does not matter.

[Socket]
ListenStream=
ListenStream=%t/gnupg-extra/S.gpg-agent
